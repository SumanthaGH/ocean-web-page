<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Ocean Dive</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>

    <!-- ======= SECTION 1: TV VIDEO PLAYER ======= -->
    <section id="tv-section">
        <!-- The Floating Character UI -> Sits next to the TV natively -->
        <div id="guide-ui">
            <div id="dialogue-bubble">
                <p id="guide-text">Press Enter to begin the dive</p>
                <!-- Shark Restart Button sits hidden in the bubble! -->
                <button id="restart-btn" style="display: none;">↩ Go Back to Start</button>
            </div>
        </div>

        <div id="tv-box">
            <video id="cinematic-video" muted playsinline preload="auto">
                <source src="island.mp4" type="video/mp4">
            </video>

            <div id="ui-layer">
                <h1 id="hero-text">INTO THE DEEP</h1>
            </div>
        </div>
    </section>

    <!-- ======= SCROLLABLE SHOWCASE SECTIONS ======= -->
    <div id="showcase-wrapper">
        <!-- Slots are now automatically, dynamically generated by editor.js! -->
    </div>

    <!-- ======= 3D MODEL OVERLAY ======= -->
    <canvas id="model-canvas"></canvas>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
    }
    </script>

    <script src="main.js"></script>
    <script type="module" src="editor.js"></script>
</body>
</html>
